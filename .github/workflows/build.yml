name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EDITH-v0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: EDITH-apk
          path: EDITH-v0.1/app/build/outputs/apk/debug/app-debug.apk
      # Publica o APK numa release para o próprio app conseguir se atualizar
      - name: Publicar versão (GitHub Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "Versão detectada: $VERSION"
          gh release delete "v$VERSION" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$VERSION" app/build/outputs/apk/debug/app-debug.apk \
            --title "EDITH $VERSION" \
            --notes "APK gerado automaticamente pelo GitHub Actions."
